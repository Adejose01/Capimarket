services:
  frontend:
    image: docker.io/library/node:22-bookworm-slim
    volumes:
      # Mapeamos la raíz al contenedor para mantener la estructura completa en VS Code
      - .:/workspace:Z
    command: sleep infinity
    depends_on:
      - pocketbase
    restart: unless-stopped

  pocketbase:
    build:
      context: .
      dockerfile: deploy/Dockerfile.pb
    ports:
      - "8090:8090"
    env_file:
      - ./apps/frontend/.env.development
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
      # ... resto de tus variables de entorno ...
    volumes:
      # Ajustado a la ruta real dentro de la carpeta 'apps'
      - ./apps/pocketbase/pb_data:/pb/pb_data:z
      - ./apps/pocketbase/pb_migrations:/pb/pb_migrations:z
      - ./apps/pocketbase/pb_hooks:/pb/pb_hooks:z

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      # Ajustado a la ruta real dentro de la carpeta 'deploy'
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:z
    depends_on:
      - frontend
      - pocketbase
    restart: unless-stopped