# =========================================================
# docker-compose.prod.yml - Configuración de Producción
# =========================================================
# Para levantar en producción:
#   docker-compose -f deploy/docker-compose.prod.yml up -d --build
#
# Variables de entorno requeridas (.env):
#   VITE_PB_URL=http://pocketbase:8090
#   PB_ADMIN_EMAIL=admin@capimercado.com
#   PB_ADMIN_PASSWORD=<contraseña segura>
# =========================================================

services:
  # =======================================================
  # Frontend Service (SPA con Vite)
  # =======================================================
  frontend:
    image: capimarket/frontend:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        VITE_PB_URL: ${VITE_PB_URL:-http://pocketbase:8090}
    # Exponemos el puerto solo internamente (Nginx se comunica con él)
    expose:
      - "80"
    # Dependencias
    depends_on:
      pocketbase:
        condition: service_healthy
    # Política de reinicio con timeout
    restart: always
    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3
      start_period: 40s
    # Resource limits para producción
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Healthcheck para monitoreo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Labels para gestión
    labels:
      - "app=capimarket"
      - "service=frontend"
      - "env=production"
    # Limitación de PIDs para evitar ZOMBIE storms
    pids_limit: 200
    # Security options
    security_opt:
      - no-new-privileges:true

  # =======================================================
  # PocketBase Service (Backend API)
  # =======================================================
  pocketbase:
    image: capimarket/pocketbase:latest
    build:
      context: .
      dockerfile: deploy/Dockerfile.pb
    # Puerto solo expuesto internamente
    expose:
      - "8090"
    # Variables de entorno
    environment:
      - PB_ADMIN_EMAIL=${PB_ADMIN_EMAIL}
      - PB_DATA_DIR=/pb/pb_data
      - PB_MIGRATIONS_DIR=/pb/pb_migrations
      - PB_HOOKS_DIR=/pb/pb_hooks
    # Credenciales sensibles usando secrets (mejor práctica)
    secrets:
      - pb_admin_password
    # Volumes para persistencia de datos
    volumes:
      # Rutas de producción con :Z para mapeo de nombres de usuario
      - ./apps/pocketbase/pb_data:/pb/pb_data:Z
      - ./apps/pocketbase/pb_migrations:/pb/pb_migrations:Z
      - ./apps/pocketbase/pb_hooks:/pb/pb_hooks:Z
    # Dependencias
    depends_on:
      # PocketBase no depende de otros servicios
    # Política de reinicio con timeout
    restart: always
    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3
      start_period: 40s
    # Resource limits para producción
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Healthcheck para monitoreo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Labels para gestión
    labels:
      - "app=capimarket"
      - "service=pocketbase"
      - "env=production"
    # Limitación de PIDs
    pids_limit: 200
    # Security options
    security_opt:
      - no-new-privileges:true
    # Ulimits para control de recursos
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # =======================================================
  # Nginx Reverse Proxy
  # =======================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      # Configuración de Nginx
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:Z
      # Configuración específica del frontend
      - ./deploy/nginx/frontend.conf:/etc/nginx/conf.d/frontend.conf:Z
    # Dependencias
    depends_on:
      frontend:
        condition: service_healthy
      pocketbase:
        condition: service_healthy
    # Política de reinicio con timeout
    restart: always
    restart_policy:
      condition: on-failure
      delay: 5s
      max_attempts: 3
      start_period: 10s
    # Resource limits para producción
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Healthcheck para monitoreo
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Labels para gestión
    labels:
      - "app=capimarket"
      - "service=nginx"
      - "env=production"
    # Limitación de PIDs
    pids_limit: 100
    # Security options
    security_opt:
      - no-new-privileges:true
    # Ulimits para control de recursos
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

# =========================================================
# Secrets - Credenciales sensibles
# =========================================================
secrets:
  pb_admin_password:
    file: .env.pb_password

# =========================================================
# Networks - Aislamiento de red
# =========================================================
networks:
  capimarket_prod:
    name: capimarket_prod
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =========================================================
# Volumes - Persistencia de datos
# =========================================================
volumes:
  capimarket_pb_data:
    name: capimarket_pb_data
  capimarket_pb_migrations:
    name: capimarket_pb_migrations
  capimarket_pb_hooks:
    name: capimarket_pb_hooks